name: "Build-Mac"
on:
  push:
    branches: [ actions ]
  pull_request:
    branches: [ actions ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js, NPM and Yarn
      uses: actions/setup-node@v3
      with:
        node-version: 'latest'
        architecture: 'x86'

    - name: Restore dependencies
      run: yarn install

    - name: Build for Mac
      run: yarn build-packages
      run: yarn build-mac
